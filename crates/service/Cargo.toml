[package]
name = "warden-service"
description = "Abyssal Warden background service: authenticated IPC, jobs, scheduling, privilege separation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
warden-core.workspace = true
warden-ipc.workspace = true
warden-remediation.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { workspace = true, features = ["termination"] }
rustix = { version = "1.1", features = ["fs", "net", "process"] }

[dev-dependencies]
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
