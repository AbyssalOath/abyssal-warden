[package]
name = "warden-winsec"
description = "Abyssal Warden Windows security primitives: the only crate allowed to use unsafe (Win32 FFI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_EventLog",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# Not `workspace = true`: this crate may use `unsafe` (Windows only, see
# docs/architecture/decisions/0019-windows-unsafe-boundary.md). Everything
# else matches the workspace, plus strict rules for unsafe blocks.
[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
