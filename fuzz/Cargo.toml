[package]
name = "warden-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
warden-core = { path = "../crates/core" }
warden-engine = { path = "../crates/engine" }
warden-heuristics = { path = "../crates/heuristics" }
warden-ipc = { path = "../crates/ipc" }
warden-yara = { path = "../crates/yara" }
warden-remediation = { path = "../crates/remediation" }
warden-system = { path = "../crates/system" }

# Kept out of the main workspace: it needs nightly and cargo-fuzz.
[workspace]

[[bin]]
name = "signature-db"
path = "fuzz_targets/signature_db.rs"
test = false
doc = false
bench = false

[[bin]]
name = "digest-parse"
path = "fuzz_targets/digest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yara-scan"
path = "fuzz_targets/yara_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit-log"
path = "fuzz_targets/audit_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive-expand"
path = "fuzz_targets/archive_expand.rs"
test = false
doc = false
bench = false

[[bin]]
name = "system-parsers"
path = "fuzz_targets/system_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "heuristics"
path = "fuzz_targets/heuristics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc-decode"
path = "fuzz_targets/ipc_decode.rs"
test = false
doc = false
bench = false
